<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline - ArrayList&lt;Suki&gt;</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">

<style>
body {
	background-color: #121212;
	color: #e0e0e0;
	font-family: 'Helvetica Neue', Arial, sans-serif;
	padding-bottom: 80px;
}

.card {
	background-color: #1e1e1e;
	border-radius: 12px;
	border: 1px solid #333;
	transition: all 0.3s ease;
	overflow: hidden;
}

.card:hover {
	transform: translateY(-8px);
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
	border-color: #2ecc71;
}

.card-img-top {
	height: 200px;
	object-fit: cover;
	filter: brightness(0.8);
	transition: 0.3s;
}

.card:hover .card-img-top {
	filter: brightness(1.0);
}

.card-link {
	text-decoration: none;
	color: inherit;
}

.card-title {
	color: #fff;
}

/* ボタンの文字位置ズレ修正用 */
.btn-sm {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: 4px;
}

.btn-custom-green {
	background-color: #2ecc71;
	color: #fff;
	border: none;
	font-weight: bold;
	padding: 8px 20px;
	border-radius: 8px;
	transition: 0.3s;
}

.badge {
	padding: 0.4em 0.8em;
	font-weight: bold;
}

.badge-book {
	background-color: rgb(0, 128, 255);
}

.badge-movie {
	background-color: #d35400;
}

.badge-game {
	background-color: #2ecc71;
}

.badge-other {
	background-color: #6c757d;
}

.text-color-pink {
	color: #ff79c6;
	font-size: 0.85em;
}

/* 下部ナビゲーション */
.navbar-mobile {
	background-color: rgba(30, 30, 30, 0.9) !important;
	backdrop-filter: blur(10px);
	border-top: 1px solid #333;
}

.nav-item-wrapper {
	flex: 1;
	display: flex;
	justify-content: center;
	align-items: center;
}

.nav-icon-link {
	text-decoration: none;
	color: #9e9e9e;
	font-size: 0.75rem;
	width: 100%;
}

.center-add-btn {
	background-color: #2ecc71;
	width: 52px;
	height: 52px;
	border-radius: 50%;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 24px;
	color: white;
	margin-top: -26px;
	border: 4px solid #121212;
}

/* 検索ボックスのプレースホルダ（ヒント文字）を薄グレーに */
.form-control::placeholder {
	color: #b0b0b0 !important;
	opacity: 1; /* Firefox対策 */
}

#viewSwitcher {
	background-color: rgba(255, 255, 255, 0.1);
	border-color: #666;
	color: #ccc;
	font-size: 0.75rem;
	padding: 4px 12px;
	border-radius: 20px;
}

/* --- スマホ時の3列表示（PC表示モード）の制御 --- */
@media ( max-width : 768px) {
	body.pc-mode-active .row-cols-1 {
		display: flex !important;
		flex-wrap: wrap !important;
	}
	body.pc-mode-active .col {
		flex: 0 0 33.3333% !important;
		max-width: 33.3333% !important;
		padding: 0 4px !important;
	}
	body.pc-mode-active .card-img-top {
		height: 100px !important;
	}

	/* サムネイル・タイトル・バッジ以外を非表示にするクラス */
	body.pc-mode-active .mobile-hide-on-3col {
		display: none !important;
	}
	body.pc-mode-active .card-title {
		font-size: 0.75rem !important;
		line-height: 1.2;
		margin-bottom: 0 !important;
		display: -webkit-box;
		-webkit-line-clamp: 2;
		-webkit-box-orient: vertical;
		overflow: hidden;
	}
	body.pc-mode-active .badge {
		font-size: 0.6rem !important;
		padding: 0.2em 0.4em !important;
	}
	.navbar-mobile {
		height: 100px !important;
		padding-bottom: 20px !important;
	}
	.center-add-btn {
		width: 78px !important;
		height: 78px !important;
		font-size: 44px !important;
		margin-top: -48px !important;
	}
	body {
		padding-bottom: 130px !important;
	}
}
</style>
</head>
<body>
	<div class="container mt-4 mb-5">

		<div class="d-flex align-items-center gap-3 mb-4">
			<h2 class="fw-bold mb-0 text-white">🌐 Timeline</h2>
			<button id="viewSwitcher" class="btn d-md-none">PC表示</button>
		</div>


		<div class="card p-3 mb-4">
			<form th:action="@{/timeline}" method="get"
				class="row g-2 align-items-center">

				<div class="col-md-3">
					<select name="category"
						class="form-select bg-dark text-white border-secondary">
						<option value="">すべてのカテゴリ</option>
						<option value="1">📖 Book</option>
						<option value="2">🎬 Movie</option>
						<option value="3">🎮 Game</option>
						<option value="99">✨ Other</option>
					</select>
				</div>

				<div class="col-md-7">
					<input type="text" name="keyword" th:value="${keyword}"
						class="form-control bg-dark text-white border-secondary"
						placeholder="キーワードで検索">
				</div>

				<div class="col-md-2 d-grid">
					<button type="submit" class="btn btn-custom-green">検索</button>
				</div>

			</form>
		</div>


		<div class="d-flex justify-content-end mb-4 gap-2">
			<a th:href="@{/mylikes}" class="btn btn-outline-danger btn-sm px-3">❤️
				Suki_List</a> <a th:href="@{/mypage}"
				class="btn btn-outline-light btn-sm px-3">📚 Collections</a>
		</div>


		<div class="row row-cols-1 row-cols-md-3 g-4" id="itemGrid">

			<div class="col" th:each="item : ${sukiList}">

				<a
					th:href="${session.user?.id == item.user?.id} ? @{/detail/{id}(id=${item.id})} : @{/view/{id}(id=${item.id})}"
					class="card-link">

					<div class="card h-100 shadow-sm">

						<img
							th:src="${#strings.isEmpty(item.thumbnailUrl) ? 'https://placehold.jp/242424/ffffff/400x300.png?text=No%20Image' : item.thumbnailUrl}"
							class="card-img-top">

						<div class="card-body py-2">

							<div
								class="mb-2 d-flex justify-content-between align-items-center">

								<div>
									<span th:if="${item.category == '1'}" class="badge badge-book">📖
										Book</span> <span th:if="${item.category == '2'}"
										class="badge badge-movie">🎬 Movie</span> <span
										th:if="${item.category == '3'}" class="badge badge-game">🎮
										Game</span> <span th:if="${item.category == '99'}"
										class="badge badge-other">✨ Other</span>
								</div>

								<div class="d-flex align-items-center">

									<img
										th:src="${#strings.isEmpty(item.user.iconPath) ? '/images/default-icon.png' : item.user.iconPath}"
										style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; margin-right: 6px;">

									<p class="text-color-pink mb-0 small">
										<span class="text-white"
											th:text="${#strings.abbreviate(item.user.username,10)}"></span>
									</p>

								</div>

							</div>


							<h5 class="fw-bold mb-1 card-title" th:text="${item.title}"></h5>


							<div class="small mb-2 fw-bold text-secondary">

								<span th:if="${item.category == '1'}"
									th:text="'Author: '+${item.creator}"></span> <span
									th:if="${item.category == '2'}"
									th:text="'Director: '+${item.creator}"></span> <span
									th:if="${item.category == '3'}"
									th:text="'Hardware: '+${item.publisher}"></span> <span
									th:if="${item.category == '99'}"
									th:text="${item.subAttribute}+' / '+${item.publisher}"></span>

							</div>


							<div class="mb-2 d-flex align-items-center gap-3">

								<span> <span style="color: #ff4757;">❤️</span> <span
									th:text="${item.likeCount!=null?item.likeCount:0}"
									class="ms-1 fw-bold text-white"></span>
								</span> <span> <span style="color: #1e90ff;">💬</span> <span
									th:text="${item.commentCount!=null?item.commentCount:0}"
									class="ms-1 fw-bold text-white"></span>
								</span> 

							</div>


							<p class="card-text small text-white-50 text-truncate"
								th:text="${item.reviewText}"></p>

						</div>
					</div>
				</a>
			</div>

		</div>
	</div>
</body>
</html>
