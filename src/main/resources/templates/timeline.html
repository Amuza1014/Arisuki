<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline - ArrayList&lt;Suki&gt;</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<style>
body {
	background-color: #121212;
	color: #e0e0e0;
	font-family: 'Helvetica Neue', Arial, sans-serif;
	padding-bottom: 80px;
}

.card {
	background-color: #1e1e1e;
	border-radius: 12px;
	border: 1px solid #333;
	transition: all 0.3s ease;
	overflow: hidden;
}

.card:hover {
	transform: translateY(-8px);
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
	border-color: #2ecc71;
}

.card-img-top {
	height: 200px;
	object-fit: cover;
	filter: brightness(0.8);
	transition: 0.3s;
}

.card:hover .card-img-top {
	filter: brightness(1.0);
}

.card-link {
	text-decoration: none;
	color: inherit;
}

.card-title {
	color: #fff;
}

.card-body {
	color: #9e9e9e;
}

.btn-custom-green {
	background-color: #2ecc71;
	color: #fff;
	border: none;
	font-weight: bold;
	padding: 8px 20px;
	border-radius: 8px;
	transition: 0.3s;
}

.btn-custom-green:hover {
	background-color: #27ae60;
	color: #fff;
}

.badge-book {
	background-color: rgb(0, 128, 255);
	padding: 0.4em 0.8em;
}

.badge-movie {
	background-color: #d35400;
	padding: 0.4em 0.8em;
}

.badge-game {
	background-color: #27ae60;
	padding: 0.4em 0.8em;
}

.badge-other {
	background-color: #6c757d;
	padding: 0.4em 0.8em;
}

.text-secondary-muted {
	color: #9e9e9e !important;
}

.text-color {
	color: white;
}

.text-color-pink {
	color: #ff79c6;
	font-size: 0.85em;
	margin-bottom: 0;
}

.navbar-mobile {
	background-color: rgba(30, 30, 30, 0.9) !important;
	backdrop-filter: blur(10px);
	border-top: 1px solid #333;
}

.nav-item-wrapper {
	flex: 1;
	display: flex;
	justify-content: center;
	align-items: center;
}

.nav-icon-link {
	text-decoration: none;
	color: #9e9e9e;
	font-size: 0.75rem;
	width: 100%;
	transition: 0.2s;
}

.center-btn-container {
	flex: 1;
	display: flex;
	justify-content: center;
	position: relative;
}

.center-add-btn {
	background-color: #2ecc71;
	width: 52px;
	height: 52px;
	border-radius: 50%;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 24px;
	color: white;
	margin-top: -26px;
	border: 4px solid #121212;
}

::placeholder {
	color: #888 !important;
	opacity: 1;
}

#viewSwitcher {
	background-color: rgba(255, 255, 255, 0.1);
	border-color: #666;
	color: #ccc;
	font-size: 0.75rem;
	padding: 4px 8px;
	transition: 0.2s;
}

/* --- PCモード切替用スタイル --- */
@media ( max-width :768px) {
	body.pc-mode-active .row-cols-1 {
		display: flex !important;
		flex-wrap: wrap !important;
	}
	body.pc-mode-active .col {
		flex: 0 0 33.3333% !important;
		max-width: 33.3333% !important;
		padding-left: 4px;
		padding-right: 4px;
	}
	body.pc-mode-active .card-img-top {
		height: 100px !important;
	}
	body.pc-mode-active .mobile-hide-on-3col {
		display: none !important;
	}
	body.pc-mode-active .title-full {
		display: none;
	}
	body.pc-mode-active .title-short {
		display: block;
		font-size: 0.8rem !important;
		line-height: 1.2;
	}
	body.pc-mode-active .badge {
		font-size: 0.65rem !important;
		padding: 0.2em 0.4em !important;
	}
	.navbar-mobile {
		height: 100px !important;
		padding-bottom: 20px !important;
	}
	.center-add-btn {
		width: 78px !important;
		height: 78px !important;
		font-size: 44px !important;
		margin-top: -48px !important;
	}
	body {
		padding-bottom: 130px !important;
	}
}


</style>
</head>

		const switcher = document.getElementById('viewSwitcher');
		if (switcher) {
			switcher.addEventListener('click', function() {
				document.body.classList.toggle('pc-mode-active');
				this.textContent = document.body.classList
						.contains('pc-mode-active') ? 'スマホ表示' : 'PC表示';
			});
