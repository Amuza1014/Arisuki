<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline - ArrayList&lt;Suki&gt;</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<style>
body {
	background-color: #121212;
	color: #e0e0e0;
	font-family: 'Helvetica Neue', Arial, sans-serif;
	padding-bottom: 80px;
}

/* カードスタイル */
.card {
	background-color: #1e1e1e;
	border-radius: 12px;
	border: 1px solid #333;
	transition: all 0.3s ease;
	overflow: hidden;
}

.card:hover {
	transform: translateY(-8px);
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
	border-color: #2ecc71;
}

.card-img-top {
	height: 200px;
	object-fit: cover;
	filter: brightness(0.8);
	transition: 0.3s;
}

.card:hover .card-img-top {
	filter: brightness(1.0);
}

.card-link {
	text-decoration: none;
	color: inherit;
}

.card-title {
	color: #ffffff;
}

.card-body {
	color: #9e9e9e;
}

/* 緑ボタン */
.btn-custom-green {
	background-color: #2ecc71;
	color: #fff;
	border: none;
	font-weight: bold;
	padding: 8px 20px;
	border-radius: 8px;
	transition: 0.3s;
}

.btn-custom-green:hover {
	background-color: #27ae60;
	color: #fff;
}

/* カテゴリバッジ */
.badge-book { background-color: rgb(0, 128, 255); padding: 0.4em 0.8em; }
.badge-movie { background-color: #d35400; padding: 0.4em 0.8em; }
.badge-game { background-color: #27ae60; padding: 0.4em 0.8em; }
.badge-other { background-color: #6c757d; padding: 0.4em 0.8em; }

.text-secondary-muted { color: #9e9e9e !important; }
.text-color { color: white; }
.text-color-pink { color: #ff79c6; font-size: 0.85em; margin-bottom: 0; }

/* 下部固定メニュー */
.navbar-mobile {
	background-color: rgba(30, 30, 30, 0.9) !important;
	backdrop-filter: blur(10px);
	border-top: 1px solid #333;
}

.nav-item-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; }
.nav-icon-link { text-decoration: none; color: #9e9e9e; font-size: 0.75rem; transition: 0.2s; width: 100%; }
.center-btn-container { flex: 1; display: flex; justify-content: center; position: relative; }
.center-add-btn { background-color: #2ecc71; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; margin-top: -26px; border: 4px solid #121212; }

::placeholder { color: #888888 !important; opacity: 1; }

#viewSwitcher {
    background-color: rgba(255, 255, 255, 0.1);
    border-color: #666;
    color: #ccc;
    font-size: 0.75rem;
    padding: 4px 8px;
    transition: 0.2s;
}

/* --- スマホ向け & PCモード（3列）時の器用な制御 --- */
@media (max-width: 768px) {
    /* メニュー規格 */
    .navbar-mobile { height: 100px !important; padding-bottom: 20px !important; }
    .center-add-btn { width: 78px !important; height: 78px !important; font-size: 44px !important; margin-top: -48px !important; }
    body { padding-bottom: 130px !important; }

    /* タイトル出し分け用の初期設定 */
    .title-short { display: none; }

    /* 【PCモード有効時（3列）のスタイル】 */
    body.pc-mode-active .row-cols-1 { display: flex !important; flex-wrap: wrap !important; }
    body.pc-mode-active .col {
        flex: 0 0 33.3333% !important;
        max-width: 33.3333% !important;
        padding-right: 4px;
        padding-left: 4px;
    }
    body.pc-mode-active .card-img-top { height: 100px !important; } /* 画像をさらにコンパクトに */

    /* 3列の時だけ要素を隠す */
    body.pc-mode-active .mobile-hide-on-3col { display: none !important; }

    /* 3列の時だけタイトルの文字制限版を表示 */
    body.pc-mode-active .title-full { display: none; }
    body.pc-mode-active .title-short { 
        display: block; 
        font-size: 0.8rem !important; 
        line-height: 1.2;
    }

    /* 3列の時だけバッジを小さく */
    body.pc-mode-active .badge {
        font-size: 0.65rem !important;
        padding: 0.2em 0.4em !important;
    }
}
</style>
</head>
<body>
	<div class="container mt-4 mb-5">
		<div class="d-flex align-items-center gap-3 mb-4">
			<h2 class="fw-bold mb-0 text-white">🌐Timeline</h2>
			<button id="viewSwitcher" class="btn d-md-none">PC表示</button>
		</div>

		<div class="card p-3 mb-4" style="background-color: #1e1e1e; border-color: #333;">
			<form th:action="@{/timeline}" method="get" class="row g-2 align-items-center">
				<div class="col-md-3">
					<select name="category" class="form-select bg-dark text-white border-secondary">
						<option value="">すべてのカテゴリ</option>
						<option value="1">📖 Book</option>
						<option value="2">🎬 Movie</option>
						<option value="3">🎮 Game</option>
						<option value="99">✨ Other</option>
					</select>
				</div>
				<div class="col-md-7">
					<input type="text" name="keyword" th:value="${keyword}" class="form-control bg-dark text-white border-secondary" placeholder="キーワードで検索">
				</div>
				<div class="col-md-2 d-grid">
					<button type="submit" class="btn btn-custom-green">検索</button>
				</div>
			</form>
		</div>

		<div class="d-flex justify-content-end mb-4 gap-2">
			<a th:href="@{/mylikes}" class="btn btn-outline-danger btn-sm px-3 flex-fill flex-md-grow-0"> ❤️ Suki_List </a> 
			<a th:href="@{/mypage}" class="btn btn-outline-light btn-sm px-3 flex-fill flex-md-grow-0"> 📚 Collections </a>
		</div>

		<div class="row row-cols-1 row-cols-md-3 g-4" id="itemGrid">
			<div class="col" th:each="item : ${sukiList}">
				<a th:href="${session.user?.id == item.user?.id} ? @{/detail/{id}(id=${item.id})} : @{/view/{id}(id=${item.id})}" class="card-link">
					<div class="card h-100 shadow-sm">
						<img th:src="${item.thumbnailUrl != null ? item.thumbnailUrl : 'https://placehold.jp/242424/ffffff/400x300.png?text=No%20Image'}" class="card-img-top">

						<div class="card-body py-2">
							<div class="mb-2 d-flex justify-content-between align-items-center">
								<div>
									<span th:if="${item.category == '1'}" class="badge badge-book">📖 Book</span> 
									<span th:if="${item.category == '2'}" class="badge badge-movie">🎬 Movie</span> 
									<span th:if="${item.category == '3'}" class="badge badge-game">🎮 Game</span>
									<span th:if="${item.category == '99'}" class="badge badge-other">✨ Other</span>
								</div>
								<p class="text-color-pink mobile-hide-on-3col d-md-block">
									投稿者：<span class="text-white" th:text="${#strings.abbreviate(item.user.username, 15)}"></span>
								</p>
							</div>

							<h5 class="fw-bold mb-1 card-title">
								<span class="title-full" th:text="${item.title}">タイトル</span>
								<span class="title-short d-md-none" th:text="${#strings.length(item.title) > 12 ? #strings.substring(item.title,0,12) + '..' : item.title}">タイトル</span>
							</h5>

							<div class="mobile-hide-on-3col d-md-block">
								<div class="small mb-2 fw-bold text-secondary">
									<span th:if="${item.category == '1'}" th:text="'Author: ' + ${item.creator}"></span> 
									<span th:if="${item.category == '2'}" th:text="'Director: ' + ${item.creator}"></span> 
									<span th:if="${item.category == '3'}" th:text="'Hardware: ' + ${item.publisher}"></span>
									<span th:if="${item.category == '99'}" th:text="${item.subAttribute} + ' / ' + ${item.publisher}"></span>
								</div>
								<div class="mb-2 d-flex align-items-center gap-3">
									<span class="small"> <span style="color: #ff4757;">❤️</span> <span th:text="${item.likeCount != null ? item.likeCount : 0}">0</span> </span> 
									<span class="small"> <span style="color: #1e90ff;">💬</span> <span th:text="${item.commentCount != null ? item.commentCount : 0}">0</span> </span>
								</div>
								<div class="mb-2">
									<span class="text-warning fw-bold small" th:if="${item.score != null}" th:text="'★ ' + ${item.score}"></span> 
									<span class="text-secondary small" th:if="${item.score == null}">未評価</span>
								</div>
								<p class="card-text small text-truncate text-secondary-muted" th:text="${item.reviewText}"></p>
							</div>
						</div>
					</div>
				</a>
			</div>
		</div>
	</div>
	
	<nav class="navbar navbar-mobile fixed-bottom py-0">
		<div class="container-fluid">
			<div class="d-flex align-items-center w-100">
				<div class="nav-item-wrapper"><a th:href="@{/mypage}" class="nav-icon-link text-center py-2"><div class="fs-4">📚</div><div>Collections</div></a></div>
				<div class="center-btn-container"><a th:href="@{/form}" class="text-decoration-none"><div class="center-add-btn">＋</div></a></div>
				<div class="nav-item-wrapper"><a th:href="@{/mylikes}" class="nav-icon-link text-center py-2"><div class="fs-4">❤️</div><div>Suki</div></a></div>
			</div>
		</div>
	</nav>
	
	<footer style="text-align: center; font-size: 0.8em; color: #666; padding: 2em 0;">
		&copy; 2026 Cチーム(仮) All Rights Reserved. 
	</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    const switcher = document.getElementById('viewSwitcher');
    if(switcher) {
        switcher.addEventListener('click', function() {
            document.body.classList.toggle('pc-mode-active');
            this.textContent = document.body.classList.contains('pc-mode-active') ? 'スマホ表示' : 'PC表示';
        });
    }
    </script>
</body>
</html>
