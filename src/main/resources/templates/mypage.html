<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collections - ArrayList&lt;Suki&gt;</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">

<style>
/* ダークテーマ */
body {
	background-color: #121212;
	color: #e0e0e0;
	font-family: 'Helvetica Neue', Arial, sans-serif;
	padding-bottom: 100px;
}

/* カード */
.card {
	background-color: #1e1e1e;
	border-radius: 12px;
	border: 1px solid #333;
	transition: all 0.3s ease;
	overflow: hidden;
}

.card:hover {
	transform: translateY(-8px);
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
	border-color: #2ecc71;
}

.card-img-top {
	height: 200px;
	object-fit: cover;
	filter: brightness(0.8);
	transition: 0.3s;
}

.card:hover .card-img-top {
	filter: brightness(1.0);
}

.card-link {
	text-decoration: none;
	color: inherit;
}

/* 緑ボタン */
.btn-custom-green {
	background-color: #2ecc71;
	color: #fff;
	border: none;
	font-weight: bold;
	padding: 8px 20px;
	border-radius: 8px;
	transition: 0.3s;
}

/* プロフィール編集 */
.profile-edit-box {
	background-color: #1e1e1e;
	border-radius: 12px;
	border: 1px solid #333;
	padding: 20px;
}

/* 入力ボックスとボタンの高さを完全に揃える */
.profile-edit-box .input-group, 
.profile-edit-box .btn-sync-height {
    height: 42px;
}

.form-control-dark {
	background-color: #121212;
	border: 1px solid #444;
	color: white;
}

.form-control-dark:focus {
	background-color: #1a1a1a;
	color: white;
	border-color: #2ecc71;
	box-shadow: none;
}

/* カテゴリバッジ */
.badge-book { background-color: rgb(0, 128, 255); }
.badge-movie { background-color: #d35400; }
.badge-game { background-color: #27ae60; }
.badge-other { background-color: #6c757d; }

.text-secondary-muted { color: #9e9e9e !important; }

/* 下部メニュー */
.navbar-mobile {
	background-color: rgba(30, 30, 30, 0.9) !important;
	backdrop-filter: blur(10px);
	border-top: 1px solid #333;
}
.nav-item-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; }
.nav-icon-link { text-decoration: none; color: #9e9e9e; font-size: 0.75rem; width: 100%; }
.center-btn-container { flex: 1; display: flex; justify-content: center; position: relative; }
.center-add-btn { background-color: #2ecc71; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; margin-top: -26px; border: 4px solid #121212; }

/* トースト通知 */
.toast-custom { 
    background-color: rgba(46, 204, 113, 0.9); 
    color: white; 
    border-radius: 8px;
    min-width: 240px;
}

/* PC切り替えボタン */
#viewSwitcher {
    background-color: rgba(255, 255, 255, 0.1);
    border-color: #666;
    color: #ccc;
    font-size: 0.75rem;
    padding: 4px 8px;
}

/* --- スマホ向け & PCモード（3列）時の器用な制御 --- */
@media (max-width: 768px) {
    .navbar-mobile { height: 100px !important; padding-bottom: 20px !important; }
    .center-add-btn { width: 78px !important; height: 78px !important; font-size: 44px !important; margin-top: -48px !important; }
    body { padding-bottom: 130px !important; }

    .title-short { display: none; }

    body.pc-mode-active .row-cols-1 { display: flex !important; flex-wrap: wrap !important; }
    body.pc-mode-active .col {
        flex: 0 0 33.3333% !important;
        max-width: 33.3333% !important;
        padding-right: 4px;
        padding-left: 4px;
    }
    body.pc-mode-active .card-img-top { height: 100px !important; }
    body.pc-mode-active .mobile-hide-on-3col { display: none !important; }
    body.pc-mode-active .title-full { display: none; }
    body.pc-mode-active .title-short { 
        display: block; 
        font-size: 0.8rem !important; 
        line-height: 1.2;
    }
    body.pc-mode-active .badge {
        font-size: 0.65rem !important;
        padding: 0.2em 0.4em !important;
    }
}
</style>
</head>

<body>
	<div class="container mt-4 mb-5">

		<div class="d-flex justify-content-start align-items-center mb-2">
			<h2 class="fw-bold mb-0 text-white">Collections</h2>
			<button id="viewSwitcher" class="btn d-md-none ms-3">PC表示</button>
		</div>

		<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
			<div>
				<p class="text-secondary-muted mb-0">お気に入りのアーカイブ</p>
				<p class="small text-secondary-muted mb-0 d-md-block">
					username: <span th:text="${#strings.abbreviate(session.user.username, 20)}"></span>
				</p>
			</div>

			<div class="d-flex flex-wrap gap-2 align-items-center">
				<a th:href="@{/form}" class="btn btn-custom-green btn-sm px-3 flex-fill">＋ New </a>
				<a th:href="@{/mylikes}" class="btn btn-outline-light btn-sm px-3 flex-fill">❤️ Suki_List</a>
				<a th:href="@{/timeline}" class="btn btn-outline-light btn-sm px-3 flex-fill">🌐 Timeline</a>
				<a th:href="@{/login}" class="btn btn-outline-danger btn-sm px-3 flex-fill">Logout</a>
			</div>
		</div>

		<div class="profile-edit-box mb-5">
			<form id="usernameForm" th:action="@{/update-username}" method="post">
				<div class="row g-3 align-items-end">
					<div class="col-md-5">
						<label for="newUsername" class="form-label small text-secondary-muted mb-2">ユーザー名の変更</label>
						<div class="input-group">
							<span class="input-group-text bg-dark border-secondary text-secondary">@</span>
							<input type="text" id="newUsername" name="newUsername" th:value="${session.user.username}" class="form-control form-control-dark" required>
						</div>
					</div>
					<div class="col-md-auto">
						<button type="submit" class="btn btn-outline-success px-4 fw-bold btn-sync-height">更新保存</button>
					</div>
					<div class="col-md-auto">
						<div id="usernameToast" class="toast toast-custom border-0" role="alert" aria-live="assertive" aria-atomic="true">
							<div class="d-flex">
								<div class="toast-body py-2">
									<i class="fas fa-check-circle me-1"></i> ユーザー名を変更しました
								</div>
								<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
							</div>
						</div>
					</div>
				</div>
			</form>
			
			<hr class="border-secondary my-5">

			<div class="row row-cols-1 row-cols-md-3 g-4" id="itemGrid">
				<div class="col" th:each="item : ${itemList}">
					<a th:href="@{/detail/{id}(id=${item.id})}" class="card-link">
						<div class="card h-100 shadow-sm">
							<img th:src="${#strings.isEmpty(item.thumbnailUrl) ? 'https://placehold.jp/242424/ffffff/400x300.png?text=No%20Image' : item.thumbnailUrl}" class="card-img-top" alt="thumbnail">
							<div class="card-body py-2">

								<div class="mb-2">
									<span th:if="${item.category == '1'}" class="badge badge-book">📖 Book</span> 
									<span th:if="${item.category == '2'}" class="badge badge-movie">🎬 Movie</span> 
									<span th:if="${item.category == '3'}" class="badge badge-game">🎮 Game</span>
									<span th:if="${item.category == '99'}" class="badge badge-other">✨ Other</span>
								</div>

								<h5 class="card-title fw-bold text-white mb-1">
									<span class="title-full" th:text="${item.title}">作品名</span>
									<span class="title-short d-md-none" th:text="${#strings.length(item.title) > 12 ? #strings.substring(item.title,0,12) + '..' : item.title}">作品名</span>
								</h5>

								<div class="mobile-hide-on-3col d-md-block">
									<div class="mb-1">
										<span class="fw-bold small" th:text="${item.score != null} ? '☆' + ${item.score} : '未評価'" th:classappend="${item.score != null} ? 'text-warning' : 'text-white'"></span>
									</div>

									<div class="small mb-2 fw-bold text-secondary-muted">
										<span th:if="${item.category == '1'}" th:text="'Author: ' + ${item.creator}"></span> 
										<span th:if="${item.category == '2'}" th:text="'Director: ' + ${item.creator}"></span> 
										<span th:if="${item.category == '3'}" th:text="'Hardware: ' + ${item.publisher}"></span>
										<span th:if="${item.category == '99'}" th:text="${item.subAttribute} + ' / ' + ${item.publisher}"></span>
									</div>

									<p class="card-text text-secondary-muted small" th:text="${#strings.length(item.reviewText) > 20} ? ${#strings.substring(item.reviewText, 0, 20)} + '…' : ${item.reviewText}">レビュー</p>
								</div>

							</div>
						</div>
					</a>
				</div>
			</div>

			<div th:if="${#lists.isEmpty(itemList)}" class="text-center mt-5 py-5">
				<p class="text-secondary-muted fs-5">まだ登録された作品はありません。</p>
			</div>
		</div>

		<nav class="navbar navbar-mobile fixed-bottom py-0">
			<div class="container-fluid">
				<div class="d-flex align-items-center w-100">
					<div class="nav-item-wrapper"><a th:href="@{/timeline}" class="nav-icon-link text-center py-2"><div class="fs-4">🌐</div><div>Timeline</div></a></div>
					<div class="center-btn-container"><a th:href="@{/form}" class="text-decoration-none"><div class="center-add-btn">＋</div></a></div>
					<div class="nav-item-wrapper"><a th:href="@{/mylikes}" class="nav-icon-link text-center py-2"><div class="fs-4">❤️</div><div>Suki</div></a></div>
				</div>
			</div>
		</nav>
		
		<footer style="text-align: center; font-size: 0.8em; color: #666; padding: 2em 0;">
			&copy; 2026 Cチーム(仮) All Rights Reserved. 
		</footer>
		
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
<script>
const switcher = document.getElementById('viewSwitcher');
if(switcher) {
    switcher.addEventListener('click', function() {
        document.body.classList.toggle('pc-mode-active');
        this.textContent = document.body.classList.contains('pc-mode-active') ? '通常表示' : 'PC表示';
    });
}

document.getElementById("usernameForm").addEventListener("submit", function(e) {
	e.preventDefault();
	const form = this;
	const formData = new FormData(form);
	fetch(form.action, { method: "POST", body: formData })
	.then(response => response.text())
	.then(() => {
		const toastElement = document.getElementById("usernameToast");
		const toast = new bootstrap.Toast(toastElement, { delay: 3000 });
		toast.show();
	})
	.catch(() => { alert("更新に失敗しました"); });
});
</script>
</html>
